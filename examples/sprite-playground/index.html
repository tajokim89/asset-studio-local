<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스프라이트 훈련장</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111816;color:#e7ece3;font:15px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:24px}header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}h1{margin:4px 0;font-size:28px;letter-spacing:-1px}.eyebrow{color:#acd695;font-size:11px;letter-spacing:3px}p{color:#a2afa4;margin:6px 0}button{font:inherit;color:#dfe9dc;border:1px solid #435447;background:#26372b;border-radius:10px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:hover,button.active{background:#405b38}#stage{position:relative;border:1px solid #415040;border-radius:16px;overflow:hidden;background:#202b22}canvas{display:block;width:100%;height:min(65vh,660px);min-height:360px;outline:none;touch-action:none;image-rendering:pixelated}.hud{position:absolute;top:16px;left:18px;pointer-events:none;display:flex;gap:8px}.badge{background:#132017df;border:1px solid #43543c;border-radius:7px;padding:7px 12px;font-size:13px}.help{display:flex;gap:20px;flex-wrap:wrap;margin:16px 0;color:#aab7ac}kbd{color:#ecedd7;background:#2a352d;padding:3px 7px;border-radius:5px;margin-right:5px}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#162219e8;z-index:3}footer{display:flex;justify-content:space-between;gap:16px;font-size:12px;color:#7c9180}.touch{display:flex;justify-content:space-between;margin-top:16px;user-select:none}.dpad{display:grid;grid-template-columns:repeat(3,48px);gap:5px}.dpad button{padding:12px 0;touch-action:none}.actions{display:flex;align-items:center;gap:10px}.actions button{height:60px;touch-action:none}#attack{background:#795138;color:#fff3dc}#note{max-width:620px}@media(max-width:600px){main{padding:12px}h1{font-size:23px}canvas{height:55vh;min-height:320px}header p{font-size:12px}.help{gap:12px;font-size:12px}footer{display:block}.hud{left:10px;top:10px}}
</style>
<main><header><div><span class="eyebrow">SPRITE PLAYGROUND / 01</span><h1>스프라이트 훈련장</h1><p>무기를 골라 오크의 움직임을 시험해 보세요.</p></div><div><label for="loadout" style="font-size:12px;color:#b2c3af">무기 선택 </label><select id="loadout" style="background:#26372b;color:#e7ece3;border:1px solid #435447;padding:10px;border-radius:8px"><option value="axe">양손 도끼 · 걷기/공격</option><option value="sword">검·방패 · 전체 동작</option></select> <button id="reset">처음으로</button></div></header>
<div id="stage"><canvas id="game" tabindex="0" aria-label="오크 이동 및 공격 훈련장"></canvas><div class="hud"><span class="badge" id="state">대기 · SE</span><span class="badge" id="hits">명중 0</span></div><div id="loading">스프라이트를 불러오는 중…</div></div>
<div class="help"><span><kbd>WASD</kbd><kbd>방향키</kbd>이동</span><span><kbd>Shift</kbd>달리기</span><span><kbd>Space</kbd>세로베기</span></div>
<footer><span id="note">상하좌우·대각선 이동 지원. 바라보는 모습은 기존 SE / SW / NE / NW 스프라이트를 사용합니다.</span><span>AXE SE / SW ATTACK: 12 FRAMES</span></footer>
<div class="touch"><div class="dpad"><span></span><button data-key="ArrowUp" aria-label="위">↑</button><span></span><button data-key="ArrowLeft" aria-label="왼쪽">←</button><button data-key="ArrowDown" aria-label="아래">↓</button><button data-key="ArrowRight" aria-label="오른쪽">→</button></div><div class="actions"><button id="run" aria-pressed="false">달리기 OFF</button><button id="attack">공격</button></div></div></main>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const keys=new Set(),images={},stateLabel=document.querySelector('#state'),hitLabel=document.querySelector('#hits');
const player={x:500,y:460,dir:'SE',action:'idle',time:0,hit:false,facingX:1,facingY:1};
const targets=[{x:320,y:260,hp:3},{x:700,y:300,hp:3},{x:820,y:510,hp:3}];
let loadout="axe";let ready=false,runToggle=false,hits=0,clock=0,last=0,manifest;
function reset(){Object.assign(player,{x:500,y:460,dir:'SE',action:'idle',time:0,hit:false,facingX:1,facingY:1});for(const t of targets){t.hp=3;t.cool=0;t.flash=0}hits=0;keys.clear();runToggle=false;document.querySelector('#run').textContent='달리기 OFF';document.querySelector('#run').setAttribute('aria-pressed','false')}
function attack(){if(!ready||player.action==='attack')return;player.action='attack';player.time=0;player.hit=false}
function release(){keys.clear();last=0}
window.addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden)release()});
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD','ShiftLeft','ShiftRight'].includes(e.code)){e.preventDefault();keys.add(e.code);if(e.code==='Space'&&!e.repeat)attack()}});
window.addEventListener('keyup',e=>keys.delete(e.code));
for(const b of document.querySelectorAll('[data-key]')){b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key);b.classList.add('active')});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{keys.delete(b.dataset.key);b.classList.remove('active')})}
document.querySelector('#attack').onclick=attack;document.querySelector('#reset').onclick=reset;
document.querySelector('#run').onclick=e=>{runToggle=!runToggle;e.currentTarget.textContent=runToggle?'달리기 ON':'달리기 OFF';e.currentTarget.setAttribute('aria-pressed',String(runToggle))};
function syncLoadout(){const axe=loadout==='axe';document.querySelector('#attack').disabled=false;document.querySelector('#run').disabled=axe;document.querySelector('#attack').textContent=axe?'내려찍기':'공격';document.querySelector('#note').textContent=axe?'양손 도끼: 걷기와 내려찍기. 이동하면서 공격할 수 있습니다. 달리기는 준비 중입니다.':'상하좌우·대각선 이동 지원. 기존 SE / SW / NE / NW 스프라이트를 사용합니다.'}
document.querySelector('#loadout').onchange=e=>{loadout=e.target.value;reset();syncLoadout();canvas.focus()};syncLoadout();
canvas.addEventListener('pointerdown',()=>canvas.focus());
function update(dt){clock+=dt;player.time+=dt;for(const t of targets){t.flash=Math.max(0,(t.flash||0)-dt);if(t.hp===0){t.cool=(t.cool||0)+dt;if(t.cool>2.5){t.hp=3;t.cool=0}}}
 let dx=Number(keys.has('ArrowRight')||keys.has('KeyD'))-Number(keys.has('ArrowLeft')||keys.has('KeyA'));
 let dy=Number(keys.has('ArrowDown')||keys.has('KeyS'))-Number(keys.has('ArrowUp')||keys.has('KeyW'));
 const moving=dx||dy,locomotion=moving?(loadout==='sword'&&(runToggle||keys.has('ShiftLeft')||keys.has('ShiftRight'))?'run':'walk'):'idle';
 // Movement continues during the swing; preserve its direction until recovery.
 if(moving){const length=Math.hypot(dx,dy),speed=locomotion==='run'?400:220;player.x=Math.max(70,Math.min(930,player.x+dx/length*speed*dt));player.y=Math.max(150,Math.min(620,player.y+dy/length*speed*dt))}
 if(player.action==='attack'){
  const clip=manifest[(loadout==='axe'?'axe_':'')+'attack_'+player.dir],duration=(clip.frames||25)/(clip.fps||16);
  if(player.time>=(clip.hitTime??.85)&&!player.hit){player.hit=true;for(const t of targets){const tx=t.x-player.x,ty=t.y-player.y,dist=Math.hypot(tx,ty),dot=(tx*player.facingX+ty*player.facingY)/(dist||1);if(t.hp>0&&dist<135&&dot>0.3){t.hp--;t.flash=.18;hits++}}}
  if(player.time<duration)return;
  player.action=locomotion;player.time=0;
 }
 if(locomotion!==player.action){player.action=locomotion;player.time=0}
 if(moving){const length=Math.hypot(dx,dy);player.facingX=dx/length;player.facingY=dy/length;const east=dx?dx>0:player.dir.endsWith('E'),south=dy?dy>0:player.dir.startsWith('S');player.dir=(south?'S':'N')+(east?'E':'W')}
}
function dummy(t){ctx.save();ctx.translate(t.x,t.y);ctx.globalAlpha=t.hp?1:.3;ctx.fillStyle='#142117';ctx.beginPath();ctx.ellipse(0,3,32,10,0,0,7);ctx.fill();ctx.fillStyle='#83613c';ctx.fillRect(-5,-85,10,85);ctx.fillRect(-36,-67,72,8);ctx.fillStyle=t.flash?'#e4bd80':'#ad9161';ctx.beginPath();ctx.ellipse(0,-61,21,29,0,0,7);ctx.fill();ctx.strokeStyle='#665132';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#cab180';ctx.beginPath();ctx.arc(0,-103,13,0,7);ctx.fill();ctx.fillStyle='#262c21';ctx.fillRect(-6,-106,3,3);ctx.fillRect(4,-106,3,3);ctx.fillStyle='#16241a';ctx.fillRect(-24,-130,48,5);ctx.fillStyle='#a9c17a';ctx.fillRect(-24,-130,16*t.hp,5);ctx.restore()}
function draw(){let rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),w=Math.round(rect.width*dpr),h=Math.round(rect.height*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#202b22';ctx.fillRect(0,0,w,h);let fit=Math.min(w/1000,h/680);ctx.setTransform(fit,0,0,fit,(w-1000*fit)/2,(h-680*fit)/2);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#29382b';ctx.fillRect(0,0,1000,680);
 for(let y=0;y<680;y+=40)for(let x=0;x<1000;x+=40){ctx.fillStyle=((x/40+y/40)%2)?'#2c3c2e':'#2a392b';ctx.fillRect(x+1,y+1,38,38)}ctx.strokeStyle='#556047';ctx.lineWidth=2;ctx.strokeRect(45,115,910,530);ctx.fillStyle='#a0ad82';ctx.font='12px monospace';ctx.fillText('TRAINING GROUNDS',65,100);
 let objects=targets.map(t=>({y:t.y,draw:()=>dummy(t)}));objects.push({y:player.y,draw:()=>{ctx.fillStyle='#14211780';ctx.beginPath();ctx.ellipse(player.x,player.y,28,9,0,0,7);ctx.fill();let key=(loadout==='axe'?'axe_':'')+player.action+'_'+player.dir,m=manifest[key],im=images[key],fps=m.fps||(player.action==='run'||player.action==='attack'?16:12),count=m.frames||25,columns=m.columns||5,frame=Math.floor(player.time*fps)%count;if(player.action==='attack')frame=Math.min(count-1,Math.floor(player.time*fps));ctx.drawImage(im,frame%columns*m.cellW,Math.floor(frame/columns)*m.cellH,m.cellW,m.cellH,Math.round(player.x-m.anchorX*m.scale),Math.round(player.y-m.anchorY*m.scale),m.cellW*m.scale,m.cellH*m.scale)}});objects.sort((a,b)=>a.y-b.y).forEach(o=>o.draw());stateLabel.textContent=({idle:'대기',walk:'걷기',run:'달리기',attack:'세로베기'})[player.action]+' · '+player.dir;hitLabel.textContent='명중 '+hits;
}
function loop(t){let dt=last?Math.min((t-last)/1000,.05):0;last=t;if(ready){update(dt);draw()}requestAnimationFrame(loop)}
fetch('sprites.json').then(r=>{if(!r.ok)throw Error('manifest');return r.json()}).then(async m=>{manifest=m;for(const [key,v] of Object.entries(m)){document.querySelector('#loading').textContent='불러오는 중: '+key;await new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{images[key]=im;resolve()};let attempt=0;im.onerror=()=>{if(++attempt<3){im.src=new URL(v.src+'?retry='+attempt,location.href).href}else reject(new Error('이미지: '+v.src))};im.src=new URL(v.src,location.href).href})};ready=true;document.querySelector('#loading').hidden=true;document.querySelector('#loading').style.display='none';canvas.focus()}).catch(e=>{console.error('Sprite loading failed',e);document.querySelector('#loading').textContent='불러오기 실패: '+e.message});requestAnimationFrame(loop);
</script></html>
